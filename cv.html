<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grace Raper — CV</title>
    <meta name="description" content="Grace Raper's CV — Emerging Technologies Engineer based in Seattle, WA.">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #FAF4E5;
            --text: #333332;
            --accent: #e8a87c;
            --accent-light: #f5c9a0;
            --muted: #888;
            --border: rgba(0,0,0,0.08);
            --max-width: 780px;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
            font-size: 15px;
        }

        /* ── Pill nav (matches the floating nav on the main portfolio) ── */
        .cv-pill {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            display: flex;
            align-items: center;
            gap: 0;
            background: rgba(250, 244, 229, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(51, 51, 50, 0.1);
            border-radius: 100px;
            padding: 0.45rem 0.6rem;
            box-shadow: 0 4px 24px rgba(51, 51, 50, 0.1);
            white-space: nowrap;
        }

        .cv-pill-link {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            text-decoration: none;
            color: #333332;
            padding: 0.4rem 1rem;
            border-radius: 100px;
            transition: background 0.18s, color 0.18s;
        }
        .cv-pill-link:hover {
            background: #333332;
            color: #FAF4E5;
        }
        .cv-pill-link.active {
            background: rgba(51, 51, 50, 0.07);
            pointer-events: none;
            cursor: default;
        }
        .cv-pill-divider {
            width: 1px;
            height: 14px;
            background: rgba(51, 51, 50, 0.1);
            flex-shrink: 0;
        }

        /* ── Top-right action buttons (print / source) ── */
        .cv-actions {
            position: fixed;
            top: 24px;
            right: 2rem;
            z-index: 999;
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .cv-btn {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            font-family: 'Montserrat', sans-serif;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 0.4rem 0.85rem;
            border-radius: 100px;
            cursor: pointer;
            text-decoration: none;
            border: 1.5px solid rgba(51, 51, 50, 0.18);
            background: rgba(250, 244, 229, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            color: #333332;
            box-shadow: 0 4px 24px rgba(51, 51, 50, 0.08);
            transition: background 0.18s, color 0.18s, border-color 0.18s;
        }
        .cv-btn:hover {
            background: #333332;
            color: #FAF4E5;
            border-color: #333332;
        }
        .cv-btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }
        .cv-btn.primary:hover { background: var(--accent-light); border-color: var(--accent-light); color: var(--text); }

        /* ── Main content ── */
        .cv-wrap {
            max-width: var(--max-width);
            margin: 0 auto;
            /* top padding clears the fixed pill nav (24px offset + ~40px pill height + generous gap) */
            padding: 8rem 2rem 5rem;
        }

        /* ── Markdown rendering ── */
        #cv-content h1 {
            font-size: 2.4rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.15;
            margin-bottom: 0.4rem;
        }

        #cv-content h1 + p {
            font-size: 13.5px;
            color: var(--muted);
            margin-bottom: 0.6rem;
        }

        #cv-content h1 + p a {
            color: var(--muted);
        }

        #cv-content h1 + p + p {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin-bottom: 2.5rem;
            padding-bottom: 2.5rem;
            border-bottom: 1.5px solid var(--border);
        }

        #cv-content h1 + p + p a {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            text-decoration: none;
            padding: 0.3rem 0.8rem;
            border-radius: 100px;
            border: 1.5px solid var(--border);
            color: var(--text);
            transition: border-color 0.2s, background 0.2s;
        }
        #cv-content h1 + p + p a:hover {
            border-color: var(--accent);
            background: rgba(232, 168, 124, 0.1);
        }

        #cv-content h2 {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--accent);
            margin-top: 2.5rem;
            margin-bottom: 1.25rem;
            padding-bottom: 0.5rem;
            border-bottom: 1.5px solid var(--border);
        }

        /* Job entries: **Title** @ [Company](url) _(dates)_ */
        #cv-content p {
            margin-bottom: 0.5rem;
        }

        #cv-content p strong {
            font-weight: 700;
        }

        #cv-content p em {
            color: var(--muted);
            font-style: normal;
            font-size: 13px;
        }

        #cv-content a {
            color: var(--text);
            text-decoration-color: var(--accent);
            text-underline-offset: 3px;
        }
        #cv-content a:hover { color: var(--accent); }

        #cv-content ul {
            list-style: none;
            margin: 0.5rem 0 1.5rem;
            padding: 0;
        }

        #cv-content li {
            position: relative;
            padding-left: 1.2rem;
            margin-bottom: 0.5rem;
            font-size: 14px;
            color: #555;
            line-height: 1.65;
        }

        #cv-content li::before {
            content: '–';
            position: absolute;
            left: 0;
            color: var(--accent);
            font-weight: 700;
        }

        #cv-content li strong em,
        #cv-content li em strong {
            font-style: normal;
            font-weight: 700;
            color: var(--text);
        }

        /* ── Loading / error states ── */
        .cv-status {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            min-height: 40vh;
            color: var(--muted);
            font-size: 14px;
        }
        .cv-spinner {
            width: 28px;
            height: 28px;
            border: 2.5px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Last-updated badge ── */
        .cv-updated {
            font-size: 11px;
            color: var(--muted);
            margin-top: 3rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
        }

        /* ── Print ── */
        @media print {
            .cv-pill, .cv-actions { display: none; }
            body { font-size: 13px; }
            #cv-content h1 { font-size: 1.8rem; }
            .cv-wrap { padding: 1rem 0; }
        }

        /* ── Mobile ── */
        @media (max-width: 600px) {
            .cv-pill { top: 14px; }
            .cv-pill-link { font-size: 11px; padding: 0.35rem 0.7rem; }
            .cv-actions { top: 14px; right: 1rem; }
            .cv-btn span { display: none; }
            .cv-wrap { padding: 7rem 1.25rem 4rem; }
            #cv-content h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

<!-- Pill nav — mirrors the floating nav on the main portfolio -->
<nav class="cv-pill" aria-label="Site navigation">
    <a class="cv-pill-link" href="/">Home</a>
    <span class="cv-pill-divider"></span>
    <a class="cv-pill-link" href="/#projects">Projects</a>
    <span class="cv-pill-divider"></span>
    <a class="cv-pill-link" href="/essays">Essays</a>
</nav>

<!-- Utility actions — tucked in the top-right corner -->
<div class="cv-actions" role="toolbar" aria-label="CV actions">
    <a class="cv-btn" href="https://github.com/grace-raper/digital-cv" target="_blank" rel="noopener" title="View source on GitHub">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
        <span>Source</span>
    </a>
    <button class="cv-btn primary" onclick="window.print()" title="Print CV">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        <span>Print</span>
    </button>
</div>

<main class="cv-wrap">
    <div id="cv-content">
        <div class="cv-status">
            <div class="cv-spinner"></div>
            <span>Loading CV…</span>
        </div>
    </div>
</main>

<script>
    const CV_URL = 'https://raw.githubusercontent.com/grace-raper/digital-cv/main/README.md';
    const API_URL = 'https://api.github.com/repos/grace-raper/digital-cv/commits?path=README.md&per_page=1';

    async function loadCV() {
        const el = document.getElementById('cv-content');
        try {
            const [mdRes, commitRes] = await Promise.allSettled([
                fetch(CV_URL),
                fetch(API_URL)
            ]);

            if (mdRes.status !== 'fulfilled' || !mdRes.value.ok) {
                throw new Error('Failed to fetch CV');
            }

            const markdown = await mdRes.value.text();
            el.innerHTML = marked.parse(markdown);

            // Append last-updated badge if commit info available
            if (commitRes.status === 'fulfilled' && commitRes.value.ok) {
                const commits = await commitRes.value.json();
                if (commits.length) {
                    const date = new Date(commits[0].commit.committer.date);
                    const label = date.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
                    const badge = document.createElement('p');
                    badge.className = 'cv-updated';
                    badge.textContent = `Last updated ${label}`;
                    el.appendChild(badge);
                }
            }

            // Open all links in new tab
            el.querySelectorAll('a').forEach(a => {
                if (a.hostname !== location.hostname) {
                    a.target = '_blank';
                    a.rel = 'noopener';
                }
            });

        } catch (err) {
            el.innerHTML = `
                <div class="cv-status">
                    <p>Couldn't load CV right now.</p>
                    <a class="cv-btn" href="${CV_URL}" target="_blank">View on GitHub</a>
                </div>`;
        }
    }

    loadCV();
</script>
</body>
</html>
